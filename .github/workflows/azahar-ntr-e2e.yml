name: Azahar NTRCARD E2E

on:
  workflow_dispatch:
  push:
    paths:
      - "prototype/azahar-ntr/**"
      - "include/gekkopak/**"
      - "src/device.cpp"
      - "tools/check_azahar_trace.py"
      - "deps.lock"
      - ".github/workflows/azahar-ntr-e2e.yml"

concurrency:
  group: azahar-ntr-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  azahar-ntr-e2e:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 2G
    steps:
      - name: Checkout GekkoPAK
        uses: actions/checkout@v4

      - name: Load pinned revisions
        run: grep -E '^[A-Z0-9_]+=' deps.lock >> "$GITHUB_ENV"

      - name: Install build tools
        run: |
          sudo apt-get update -y
          sudo apt-get install -y gcc-12 g++-12 clang lld llvm cmake ninja-build python3 ccache

      - name: Restore Azahar compiler cache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: azahar-2126-linux-gcc12-gekkopak-ntr-v1

      - name: Configure compiler cache
        run: |
          ccache --set-config=max_size=$CCACHE_MAXSIZE
          ccache --zero-stats

      - name: Run transport-only model
        run: bash ./prototype/azahar-ntr/scripts/run_model.sh

      # Fail fast: if the shared core no longer answers the golden vectors,
      # there is no point building Azahar around it.
      - name: Run golden vectors against the shared core
        run: |
          cmake -S . -B build-conformance -DCMAKE_BUILD_TYPE=Release
          cmake --build build-conformance --target gekkopak_conformance -j 2
          ./build-conformance/gekkopak_conformance

      - name: Fetch the pinned Azahar unified source
        run: |
          curl -L --fail --retry 3 \
            -o azahar-source.tar.xz \
            "https://github.com/azahar-emu/azahar/releases/download/${AZAHAR_VERSION}/azahar-unified-source-${AZAHAR_VERSION}.tar.xz"
          echo "${AZAHAR_SOURCE_SHA256}  azahar-source.tar.xz" | sha256sum -c -
          mkdir azahar-src
          tar -xJf azahar-source.tar.xz -C azahar-src --strip-components=1

      - name: Apply and verify GekkoPAK core overlay
        run: |
          python3 prototype/azahar-ntr/azahar_overlay/apply_overlay.py azahar-src
          python3 prototype/azahar-ntr/azahar_overlay/verify_overlay.py azahar-src

      - name: Build software-only patched Azahar libretro core
        run: |
          cmake -G Ninja -S azahar-src -B azahar-src/build/gekkopak \
            -DENABLE_LIBRETRO=ON \
            -DENABLE_TESTS=OFF \
            -DENABLE_LTO=OFF \
            -DENABLE_SOFTWARE_RENDERER=ON \
            -DENABLE_OPENGL=OFF \
            -DENABLE_VULKAN=OFF \
            -DCMAKE_C_COMPILER=gcc-12 \
            -DCMAKE_CXX_COMPILER=g++-12 \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build azahar-src/build/gekkopak \
            --target citra_libretro --config Release -j 4
          ccache --show-stats

      - name: Upload patched Azahar core
        uses: actions/upload-artifact@v4
        with:
          name: azahar-2126-gekkopak-ntr-v1-core
          path: azahar-src/build/gekkopak/bin/Release/azahar_libretro.so
          if-no-files-found: error
          retention-days: 7

      - name: Build ARM guest and validating frontend
        run: |
          bash ./prototype/azahar-ntr/scripts/build_guest.sh prototype/azahar-ntr/build/e2e
          gcc -O2 -std=c11 -Wall -Wextra -Werror \
            prototype/azahar-ntr/frontend/ntr_frontend.c -ldl \
            -o prototype/azahar-ntr/build/e2e/ntr_frontend
          mkdir -p prototype/azahar-ntr/build/e2e/{system,saves,assets}

      - name: Run real Azahar NTRCARD guest E2E
        run: |
          CORE=azahar-src/build/gekkopak/bin/Release/azahar_libretro.so
          test -f "$CORE"
          GEKKOPAK_TRACE=1 \
          GEKKOPAK_SYSTEM_DIR="$PWD/prototype/azahar-ntr/build/e2e/system" \
          GEKKOPAK_SAVE_DIR="$PWD/prototype/azahar-ntr/build/e2e/saves" \
          GEKKOPAK_ASSETS_DIR="$PWD/prototype/azahar-ntr/build/e2e/assets" \
            timeout 60s prototype/azahar-ntr/build/e2e/ntr_frontend \
              "$CORE" \
              "$PWD/prototype/azahar-ntr/build/e2e/gekkopak_guest_ntr.elf" \
              2>&1 | tee prototype/azahar-ntr/build/e2e/azahar-ntr-e2e.log
          grep -q "NTR E2E PASS" prototype/azahar-ntr/build/e2e/azahar-ntr-e2e.log
          grep -q "Mapped GekkoPAK NTRCARD window" prototype/azahar-ntr/build/e2e/azahar-ntr-e2e.log
          grep -q "GKPAK-TRACE F4474B00" prototype/azahar-ntr/build/e2e/azahar-ntr-e2e.log
          grep -q "GKPAK-TRACE F5474B01" prototype/azahar-ntr/build/e2e/azahar-ntr-e2e.log
          grep -q "steady transfers: 3" prototype/azahar-ntr/build/e2e/azahar-ntr-e2e.log
          grep -q "GekkoPAK NTR guest completed" prototype/azahar-ntr/build/e2e/azahar-ntr-e2e.log

      # Gate 4: the guest did not merely reach PASS, it spoke the protocol the
      # golden vectors describe -- every command carrying the GK discriminator,
      # in a valid F0-F5 order, ending in COMPLETE.
      - name: Check the guest command stream against the protocol
        run: |
          python3 tools/check_azahar_trace.py \
            prototype/azahar-ntr/build/e2e/azahar-ntr-e2e.log \
            --print-stream | tee prototype/azahar-ntr/build/e2e/trace-check.log

      - name: Upload E2E log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: azahar-ntr-e2e-log
          path: |
            prototype/azahar-ntr/build/e2e/azahar-ntr-e2e.log
            prototype/azahar-ntr/build/e2e/trace-check.log
          if-no-files-found: ignore
