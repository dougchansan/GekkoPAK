name: Azahar NTRCARD E2E

on:
  workflow_dispatch:
  push:
    paths:
      - "prototype/azahar-ntr/**"
      - ".github/workflows/azahar-ntr-e2e.yml"

jobs:
  azahar-ntr-e2e:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 2G
    steps:
      - name: Checkout GekkoPAK
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update -y
          sudo apt-get install -y gcc-12 g++-12 clang lld llvm cmake ninja-build python3 ccache

      - name: Restore Azahar compiler cache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: azahar-2126-linux-gcc12-gekkopak-ntr-v1

      - name: Configure compiler cache
        run: |
          ccache --set-config=max_size=$CCACHE_MAXSIZE
          ccache --zero-stats

      - name: Run transport-only model
        run: bash ./prototype/azahar-ntr/scripts/run_model.sh

      - name: Fetch Azahar 2126.0 unified source
        run: |
          curl -L --fail --retry 3 \
            -o azahar-source.tar.xz \
            https://github.com/azahar-emu/azahar/releases/download/2126.0/azahar-unified-source-2126.0.tar.xz
          echo "c2764473fa465f88f3b8c90efd56b3aa0a6244919a49742eeb407fe42bd869a8  azahar-source.tar.xz" | sha256sum -c -
          mkdir azahar-src
          tar -xJf azahar-source.tar.xz -C azahar-src --strip-components=1

      - name: Apply and verify GekkoPAK core overlay
        run: |
          python3 prototype/azahar-ntr/azahar_overlay/apply_overlay.py azahar-src
          python3 prototype/azahar-ntr/azahar_overlay/verify_overlay.py azahar-src

      - name: Build patched Azahar libretro core
        run: |
          cmake -S azahar-src -B azahar-src/build/gekkopak \
            -DENABLE_LIBRETRO=ON \
            -DENABLE_TESTS=OFF \
            -DENABLE_LTO=OFF \
            -DCMAKE_C_COMPILER=gcc-12 \
            -DCMAKE_CXX_COMPILER=g++-12 \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build azahar-src/build/gekkopak \
            --target citra_libretro --config Release -j 2
          ccache --show-stats

      - name: Build ARM guest and validating frontend
        run: |
          bash ./prototype/azahar-ntr/scripts/build_guest.sh prototype/azahar-ntr/build/e2e
          gcc -O2 -std=c11 -Wall -Wextra -Werror \
            prototype/azahar-ntr/frontend/ntr_frontend.c -ldl \
            -o prototype/azahar-ntr/build/e2e/ntr_frontend
          mkdir -p prototype/azahar-ntr/build/e2e/{system,saves,assets}

      - name: Run real Azahar NTRCARD guest E2E
        run: |
          CORE=azahar-src/build/gekkopak/bin/Release/azahar_libretro.so
          test -f "$CORE"
          GEKKOPAK_SYSTEM_DIR="$PWD/prototype/azahar-ntr/build/e2e/system" \
          GEKKOPAK_SAVE_DIR="$PWD/prototype/azahar-ntr/build/e2e/saves" \
          GEKKOPAK_ASSETS_DIR="$PWD/prototype/azahar-ntr/build/e2e/assets" \
            timeout 60s prototype/azahar-ntr/build/e2e/ntr_frontend \
              "$CORE" \
              "$PWD/prototype/azahar-ntr/build/e2e/gekkopak_guest_ntr.elf" \
              2>&1 | tee prototype/azahar-ntr/build/e2e/azahar-ntr-e2e.log
          grep -q "NTR E2E PASS" prototype/azahar-ntr/build/e2e/azahar-ntr-e2e.log
          grep -q "Mapped GekkoPAK NTRCARD window" prototype/azahar-ntr/build/e2e/azahar-ntr-e2e.log
          grep -q "GekkoPAK NTR guest completed" prototype/azahar-ntr/build/e2e/azahar-ntr-e2e.log

      - name: Upload E2E log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: azahar-ntr-e2e-log
          path: prototype/azahar-ntr/build/e2e/azahar-ntr-e2e.log
          if-no-files-found: ignore
